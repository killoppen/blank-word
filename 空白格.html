function openQuizSetup() {
    const overlay = document.getElementById('quizOverlay');
    const body = document.getElementById('quizBody');

    // 收集所有常规词本（排除复习词本）
    const nbList = [];
    for (let id in notebooks) {
        if (id === REVIEW_NOTEBOOK_ID) continue;
        const nb = notebooks[id];
        if (nb.isQuiz) continue;
        const rows = nb.data.rows;
        const count = rows.filter(function(r) { return r[BASE_COL_0] && r[BASE_COL_0].value && r[BASE_COL_0].value.trim(); }).length;
        if (count > 0) nbList.push({ id: id, name: nb.name || '未命名', count: count });
    }

    if (nbList.length === 0) {
        body.innerHTML = '<div style="text-align:center;padding:30px;color:#94a3b8;">📭 没有可测验的单词，请先添加词本</div><div style="display:flex;gap:10px;margin-top:16px;"><button class="quiz-close-btn" onclick="closeQuiz()" style="flex:1;padding:12px;border-radius:12px;border:none;cursor:pointer;background:#e2e8f0;color:#475569;font-weight:600;">关闭</button></div>';
        overlay.classList.add('show');
        return;
    }

    var html = '<div class="quiz-setup-section"><label>📓 选择词本（勾选要合并的词本）</label><div class="quiz-nb-list" id="quizNbList">';
    for (var i = 0; i < nbList.length; i++) {
        var n = nbList[i];
        html += '<label class="quiz-nb-item"><input type="checkbox" class="quiz-nb-cb" value="' + n.id + '"><span>' + escapeHtml(n.name) + ' (' + n.count + '词)</span></label>';
    }
    html += '</div></div>';
    html += '<div class="quiz-setup-section"><label>📊 单词数量</label><div class="quiz-count-btns" id="quizCountBtns">';
    html += '<button data-count="10">10 词</button>';
    html += '<button data-count="20" class="active">20 词</button>';
    html += '<button data-count="50">50 词</button>';
    html += '<button data-count="0">全部</button>';
    html += '</div></div>';
    html += '<div class="quiz-setup-section"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="quizShuffleCb" checked> 🔀 随机打乱顺序</label></div>';
    html += '<div style="margin-top:8px;font-size:0.8rem;color:#94a3b8;" id="quizTotalHint">已选: 0 个单词（请先勾选词本）</div>';
    html += '<button class="quiz-start-btn" id="quizStartBtn">📓 生成测验词本</button>';
    body.innerHTML = html;

    setTimeout(function() {
        var btn = document.getElementById('quizStartBtn');
        if (btn) {
            btn.addEventListener('click', function() {
                createQuizNotebook(nbList);
            });
        }
    }, 0);

    // 数量选择
    var countBtns = document.getElementById('quizCountBtns').querySelectorAll('button');
    for (var i = 0; i < countBtns.length; i++) {
        countBtns[i].addEventListener('click', function() {
            var parent = this.parentNode;
            var btns = parent.querySelectorAll('button');
            for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
            this.classList.add('active');
        });
    }

    // 词本选择 - 更新总数提示
    var cbs = document.querySelectorAll('.quiz-nb-cb');
    for (var i = 0; i < cbs.length; i++) {
        cbs[i].addEventListener('change', function() {
            var total = 0;
            var checked = document.querySelectorAll('.quiz-nb-cb:checked');
            for (var k = 0; k < checked.length; k++) {
                for (var m = 0; m < nbList.length; m++) {
                    if (nbList[m].id === checked[k].value) total += nbList[m].count;
                }
            }
            document.getElementById('quizTotalHint').textContent = '已选: 共 ' + total + ' 个单词';
        });
    }

    overlay.classList.add('show');
}

function createQuizNotebook(nbList) {
    var selected = [];
    var checked = document.querySelectorAll('.quiz-nb-cb:checked');
    for (var i = 0; i < checked.length; i++) selected.push(checked[i].value);
    if (selected.length === 0) { alert('请先勾选要测验的词本'); return; }

    var activeBtn = document.querySelector('#quizCountBtns .active');
    var count = activeBtn ? (parseInt(activeBtn.getAttribute('data-count')) || 0) : 0;
    var shuffle = document.getElementById('quizShuffleCb').checked;

    // 收集单词
    var words = [];
    for (var i = 0; i < selected.length; i++) {
        var id = selected[i];
        if (!notebooks[id]) continue;
        var rowsData = notebooks[id].data.rows;
        for (var j = 0; j < rowsData.length; j++) {
            var row = rowsData[j];
            var w = row[BASE_COL_0] ? (row[BASE_COL_0].value || '').trim() : '';
            var m = row[BASE_COL_1] ? (row[BASE_COL_1].value || '').trim() : '';
            if (w) words.push({ word: w, meaning: m });
        }
    }

    if (words.length === 0) { alert('所选词本中没有有效单词'); return; }

    // 随机打乱
    if (shuffle) {
        for (var i = words.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = words[i]; words[i] = words[j]; words[j] = tmp;
        }
    }

    // 截取数量
    var totalWords = count > 0 ? Math.min(count, words.length) : words.length;
    words = words.slice(0, totalWords);

    // 生成不重复的词本名称
    var quizIndex = 1;
    var existingNames = [];
    for (var id in notebooks) {
        if (id !== REVIEW_NOTEBOOK_ID) existingNames.push(notebooks[id].name);
    }
    while (existingNames.indexOf('测验词本 ' + quizIndex) !== -1) quizIndex++;
    var newName = '测验词本 ' + quizIndex;

    // 创建新词本
    var newId = 'notebook_' + Date.now();
    var newRows = [];
    for (var i = 0; i < words.length; i++) {
        var row = {};
        row[BASE_COL_0] = { value: words[i].word, isWhitedOut: false };
        row[BASE_COL_1] = { value: words[i].meaning, isWhitedOut: false };
        newRows.push(row);
    }

    notebooks[newId] = {
        name: newName,
        isReview: false,
        isQuiz: true,
        data: {
            rows: newRows,
            allColIds: new Set([BASE_COL_0, BASE_COL_1]),
            nextColId: 2,
            selectedRow: 0,
            selectedColIdx: 0,
            tabPressCount: 0,
            originalRowsSnapshot: null
        }
    };

    saveAllNotebooks();
    activeNotebookId = newId;
    loadCurrentNotebookData();
    renderSidebar();
    closeQuiz();
}

function closeQuiz() {
    document.getElementById('quizOverlay').classList.remove('show');
}
</script>
</body>
</html>
